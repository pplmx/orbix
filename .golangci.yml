# golangci-lint configuration.
#
# The defaults are kept, with two narrow exceptions where the standard idiom is
# noisier than the signal it carries.

version: "2"

linters:
  default: standard
  exclusions:
    generated: lax
    rules:
      # Writing a formatted line to a buffered writer is the documented way to
      # use tabwriter, and the writes cannot fail until Flush. Flush is checked
      # once per section, which is where a real I/O error actually surfaces.
      - linters: [errcheck]
        path: cmd/orbix/inspect\.go
        text: "fmt\\.Fprint"
      - linters: [errcheck]
        path: cmd/orbix/inspect\.go
        text: "tw\\.Flush"
      # Test helpers read a pipe and close its writer; a failure there means the
      # test binary itself is broken, not the code under test.
      - linters: [errcheck]
        path: _test\.go
        text: "(ReadFrom|w\\.Close|rc\\.Close)"
      # The template lexer's outer switch dispatches on a byte classification whose
      # cases are compound (three whitespace bytes, two quote bytes) and whose bodies
      # are unlike. A tagged switch would move those conditions into the case labels,
      # where they are harder to read than the `case c == ' ' || ...` form.
      - linters: [staticcheck]
        path: internal/chat/expr\.go
        text: "QF1002"

  settings:
    depguard:
      # The dependency direction AGENTS.md calls a hard constraint: "dependencies point
      # downward only". Only one class of violation needs a linter: a dependency between two
      # packages at the same level. Everything else -- llamas importing the server, the engine
      # importing the server -- closes a cycle through the reverse edge and the compiler
      # rejects it before lint runs. Two leaves have no reverse edge to close, so an import
      # between them compiles, passes every test, and quietly couples two layers that were
      # meant to be independent.
      rules:
        leaves-stay-independent:
          files:
            - "**/internal/gguf/**"
            - "**/internal/f16/**"
            - "**/internal/kernel/**"
            - "**/internal/chat/**"
            - "**/internal/otel/**"
          deny:
            - pkg: "github.com/pplmx/orbix/internal/tokenize"
              desc: "tokenize is a leaf; it may depend on gguf, and nothing may depend on it from below"
            - pkg: "github.com/pplmx/orbix/internal/quant"
              desc: "quant is a leaf above gguf and f16"
  enable:
    - depguard

formatters:
  enable:
    - gofmt
    - goimports
