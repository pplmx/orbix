# Continuous integration.
#
# The point of this file is to make the README's claims checkable rather than
# asserted: that the project builds with CGo disabled on every platform it names, that
# its tests pass without a model checkpoint on disk, and that the module still has no
# external dependencies. Each of those is a statement in the documentation that was
# true when written, and nothing was verifying it stayed true.
#
# `just check` is the entry point rather than a list of go commands, because the local
# gate and CI must not drift: a contributor who runs `just check` and sees green should
# be able to predict CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request that is pushed to twice should cancel the first run: its result is
# already superseded, and the queue would otherwise be spent on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Belt and braces with the justfile, which exports this itself. A build that picks up
  # CGo is the one failure this project cannot tolerate, and an environment variable
  # inherited from somewhere else is exactly how that would happen.
  CGO_ENABLED: "0"

jobs:
  # The gate: format, vet, test, lint. Everything else is a narrower check of something
  # this job would also catch, kept separate so a failure names the claim that broke.
  check:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # just is the entry point for every command in this repository, so each job that runs
      # one installs it. Pinned to the major version the local justfile is developed against.
      - uses: extractions/setup-just@v4

      - uses: actions/setup-go@v7
        with:
          # Pinned to the minor version in go.mod, not to "stable": go.mod declares
          # go 1.27.0, and a newer toolchain could reject it for reasons unrelated to
          # this commit.
          go-version: "1.27"
          cache: true

      - name: Install golangci-lint
        # v9 is the action line that pairs with golangci-lint v2: v7 made v2 support the
        # only mode, and v6 predates it. The version below has to stay on v2 for the same
        # reason.
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned exactly. A linter that changes its mind between runs turns a green
          # branch red without a code change, which is worse than a missed finding.
          version: v2.15.0

      - name: just check
        run: just check

      - name: report skipped tests
        # Skipped tests are not failures, but a rising count is how coverage disappears
        # without anything going red: before the fixture existed, a clean runner skipped
        # 74 tests that a developer's machine ran. Printing the number puts it in every
        # run's record instead of leaving it to be discovered.
        # `just skips`, not a copy of its pipeline. AGENTS.md says CI's Go jobs call the
        # recipes rather than restating them, and this step was the one place that did not --
        # so the recipe's `|| true` and this copy could drift apart without either noticing.
        # The recipe also fails when the suite fails now, which this step could not do before.
        run: |
          skips="$(just skips)"
          echo "skipped tests: $skips"
          {
            echo "### Skipped tests: $skips"
            echo ""
            echo "These need a model checkpoint or a benchmark input, so they do not run here."
            echo "The suite runs without one: see internal/gguftest."
          } >> "$GITHUB_STEP_SUMMARY"

  # Every platform the README claims, in one runner. The list lives in the justfile's
  # CROSS_TARGETS, which is the single place it is written down: a matrix here would be
  # a second copy that drifts the first time a target changes. One job rather than one
  # per platform because a cross-compile is seconds of work, and five jobs would add
  # setup overhead without isolating anything -- if the tree stops compiling for arm64 it
  # is the same failure that stops it for amd64.
  cross:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: just cross
        run: just cross

      - name: verify no CGo
        # The ban is checked against every artifact rather than against the environment that
        # produced it, and against the artifact's own recorded build settings rather than by
        # running it -- only linux/amd64 can be executed here, but `go version -m` reads the
        # buildinfo of any Go binary, including the ones for platforms this job cannot run.
        #
        # Every target shares the justfile's exported CGO_ENABLED today, so checking one would
        # pass whenever the others do. The loop is what keeps that true: a per-target override
        # added later, or a platform whose default differs, shows up here instead of as a
        # mystery on a user's machine.
        run: |
          ./bin/orbix-linux-amd64 version
          failed=0
          for f in bin/orbix-*; do
            if ! go version -m "$f" | grep -q 'CGO_ENABLED=0'; then
              echo "::error::$f was not built with CGO_ENABLED=0"
              failed=1
            fi
          done
          exit $failed

      - name: report artifacts
        run: ls -l bin/
  # macOS arm64 is the platform a contributor is most likely to run this on, and it is
  # the one whose kernel code path (no assembly anywhere, but different scheduler
  # behaviour) a linux-only job cannot exercise.
  test-darwin:
    name: test (darwin/arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # just, because the suite needs it. TestEveryRecipeIsDocumented shells out to
      # `just --list`, and it used to skip when that failed -- so this job ran green having
      # verified nothing about the justfile. It fails now, which is the point of a guard, and
      # this step is what keeps that failure from being a macOS-only red.
      - uses: extractions/setup-just@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: go test
        run: go test ./... -count=1

  isolate:
    name: test order independence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      # -shuffle=on and -count=2 catch the two failures the gate cannot: a test that passes
      # only because an earlier one left state behind, and one that is not idempotent. Neither
      # is visible when every package runs once in source order, which is how `just test` and
      # the gate job run it. The recipe says why it is not inside `check`: a shuffled failure
      # names a seed rather than a bug, and the gate is meant to answer yes or no.
      - name: just isolate
        run: just isolate

  # The race detector needs CGo on some toolchains, so it runs here rather than in the
  # gate: CGO_ENABLED=0 is the only supported build, but the race detector is a test
  # instrument, not a build artifact.
  race:
    name: test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: just test-race
        run: just test-race


  # The unit tests race the concurrency that appears in them; this races the mix a deployed
  # server actually sees. It needed a checkpoint until `just fixture` existed, which is why it
  # ran on developer machines only -- and on none of them unless someone remembered. The fixture
  # it generates is random weights, which is fine: the script measures whether a disconnect is
  # handled, not what the model said.
  #
  # Six seconds here, including the race build. The script fails on four things -- a DATA RACE, a
  # 5xx, a non-zero active gauge, or nothing having been cancelled -- and the last one is what
  # keeps it from reporting ok after testing nothing.
  stress:
    name: stress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: just fixture
        run: just fixture

      - name: just stress
        run: just MODEL=.cache/stress.gguf stress

  # The Dockerfile is the one artifact nothing built. Its parts are checkable by reading -- the
  # ARG-to-ldflags wiring, the .dockerignore exclusions, the HEALTHCHECK port falling inside the
  # CMD's -- and that reading is what was done while writing it. What reading cannot settle is
  # whether the image builds at all: `FROM golang:1.27` names a tag, and a tag either resolves on
  # the runner or does not, and the scratch stage copies two paths that either exist in the
  # builder or do not.
  #
  # The run step matters as much as the build. A scratch image has no shell, so the HEALTHCHECK
  # runs /orbix healthcheck -- the whole reason that command exists. Building the image without
  # starting it would leave the one thing the command was written for unverified.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      # The fixture is a runnable checkpoint, which is what the container needs to reach the
      # point where /healthz answers: the probe is served only after the engine exists.
      - name: just fixture
        run: just fixture

      - name: docker build
        run: |
          docker build \
            --build-arg VERSION="v0.0.0-ci" \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            -t orbix:ci .

      # The tag has to reach the binary. `just cross` is verified for this in the release
      # workflow; the image is built by a different path (the Dockerfile's own ldflags), so it
      # needs its own check.
      - name: the image reports the version it was built with
        run: |
          got=$(docker run --rm orbix:ci version | head -1 | awk '{print $2}')
          if [ "$got" != "v0.0.0-ci" ]; then
            echo "::error::image reports $got, build arg was v0.0.0-ci"
            exit 1
          fi

      # Started, then waited on. `docker inspect` reports the healthcheck's own verdict, which
      # is the thing this job exists to learn: a container that runs but never turns healthy is
      # the failure mode a start-period is meant to cover, and a plain `docker run` would report
      # success for it.
      - name: the container turns healthy
        run: |
          export HEALTH_FMT='{{.State.Health.Status}}'
          cid=$(docker run -d -p 8080:8080 \
            -v "$PWD/.cache:/models:ro" \
            orbix:ci serve --model /models/stress.gguf --addr :8080)
          echo "container $cid"
          # 90 attempts of 2s, which is 180s against a start-period of 120s plus one 30s
          # interval. The three numbers are not free choices: waiting less than the
          # start-period would call a container unhealthy while the image says that much time
          # is allowed, and waiting less than one interval would report a timeout before the
          # first verdict exists.
          for i in $(seq 1 90); do
            # Through a variable so the Go template syntax is not interleaved with the shell's
            # own quoting: nested single quotes inside a -f '...' argument are a reading hazard
            # even where they parse.
            state=$(docker inspect -f "$HEALTH_FMT" "$cid" 2>/dev/null || echo none)
            echo "attempt $i: $state"
            if [ "$state" = "healthy" ]; then
              docker logs "$cid" | tail -5
              docker rm -f "$cid" >/dev/null
              exit 0
            fi
            if [ "$state" = "unhealthy" ]; then
              docker logs "$cid"
              docker rm -f "$cid" >/dev/null
              echo "::error::the container never turned healthy"
              exit 1
            fi
            sleep 2
          done
          docker logs "$cid"
          docker rm -f "$cid" >/dev/null
          echo "::error::the container did not become healthy within 180s"
          exit 1

  # The hooks in .pre-commit-config.yaml check things `just check` does not: trailing
  # whitespace and final newlines in non-Go files, YAML/TOML/JSON syntax, and merge-conflict
  # markers. Measured before adding this job -- appending a whitespace line to
  # .github/workflows/ci.yml left `just check` green, so nothing was catching it.
  #
  # Local hooks only run for whoever installed them; without this job the checks apply to
  # contributors who remembered `prek install` and to nobody else.
  prek:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # An exact version, not a major tag: prek-action stopped publishing moving major and
      # minor tags at v3, so `@v3` would not resolve. Bumping it should be a reviewed commit
      # rather than a branch that turns red when upstream changes a rule.
      #
      # No extra-args: the action already runs `prek run --all-files`.
      - uses: j178/prek-action@v3.1.1

  # The commit-msg hook checks one message as it is written, and only where `prek install`
  # ran. Nothing checked a branch as a whole: `prek run --all-files` skips commit-msg hooks
  # (they need a message file), and `--last-commit` runs the same file hooks over one commit.
  # So the format was conventional by habit rather than by gate.
  #
  # `cz check --rev-range` is the range form, which is why `just commits` exists to wrap it.
  commits:
    name: commits
    runs-on: ubuntu-latest
    steps:
      # Full history of the head, plus the base branch by name: `cz check --rev-range`
      # resolves both ends, and a default depth-1 checkout has neither. `ref` is what puts
      # origin/<base_ref> into the clone -- fetch-depth alone does not create that remote
      # branch, because actions/checkout fetches one ref unless told otherwise.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: extractions/setup-just@v4

      - name: fetch the base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: install commitizen
        run: pip install "commitizen>=4,<5"

      # On a pull request the range is base..head. On a push to main there is nothing to
      # compare against, so only the pushed commit is checked.
      #
      # RANGE goes before the recipe name. `just commits RANGE=...` reads an assignment as a
      # recipe to run, so it failed with "justfile does not contain recipe
      # `RANGE=HEAD~1..HEAD`" -- which is what carryover from `make commits RANGE=...` looks
      # like, where the assignment may follow the target. Nothing caught it locally: the
      # pull-request form resolves fine in a checkout that has origin/<base>, and the push
      # form only runs on main, where the failure is on a commit that is already pushed.
      - name: just commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            just RANGE="origin/${{ github.base_ref }}..HEAD" commits
          else
            just RANGE="HEAD~1..HEAD" commits
          fi

  # Documentation is code here: the README is the entry page, docs/ carries the body and
  # the pull-request template shapes every contribution, so a broken link or a malformed
  # table is a defect like any other. This job runs the same `just docs` a contributor runs.
  #
  # It does not lint the package doc.go files -- those are Go, and rumdl refuses them.
  # Their prose is checked by review, which is why it lives in the diff.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The project ships its own action, so the download is not reimplemented here. The
      # earlier hand-rolled curl fetched a release asset by a name guessed from
      # convention and was a 404: rumdl names its assets with the target triple
      # (rumdl-v0.3.4-x86_64-unknown-linux-gnu.tar.gz), and pinning a floating tag would
      # not have fixed it. The action also keeps the asset naming out of this repository
      # entirely, which is the part that should not need maintaining.
      #
      # The version is pinned rather than left at `latest`: a new upstream rule must not
      # turn a green branch red without a change here, and bumping it should be a commit
      # someone can review.
      - uses: rvben/rumdl@v0
        with:
          version: "0.3.4"
          report-type: annotations

  # gguf_xcheck parses the same file with the Python gguf package and compares every tensor's
  # type, shape and SHA-256 against this repository's reader. It is the only check that uses an
  # implementation nobody on this project wrote, so a reader that agrees with its own fixture
  # builder cannot hide behind it -- and it ran nowhere automatic until this job.
  #
  # The synthetic fixture is enough: what is compared is the container, not the weights.
  xcheck:
    name: xcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - uses: astral-sh/setup-uv@v10.4.0

      - name: just fixture
        run: just fixture

      - name: just build
        run: just build

      - name: just xcheck
        run: just MODEL=.cache/stress.gguf xcheck

  # jinja_diff renders chat templates through internal/chat and through real Jinja2 and
  # compares the text. The package's own tests assert against strings typed by hand, which
  # can share a blind spot with the code they check; Jinja2 is the one implementation here
  # that nobody on this project wrote, so it answers the question the unit tests cannot.
  #
  # It ran only by hand until this job, and the cost of that is measured: `namespace()` was
  # implemented in 2605ec3 while still listed in the script's UNSUPPORTED table, so the tool
  # exited 1 from that commit onward and nothing noticed. A gate nobody runs is not a gate.
  #
  # No checkpoint is needed -- the corpus lives in the script and the Go side is compiled at
  # run time -- so this is the cheapest non-Go job in the matrix.
  jinja-diff:
    name: jinja-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - uses: astral-sh/setup-uv@v10.4.0

      - name: just jinja-diff
        run: just jinja-diff

  # The four checks below are the other half of the same idea as xcheck: each compares this
  # repository's implementation against one written from a source outside it -- GPT-2's
  # published regex, ggml's quantize.c, the RoFormer definition of the rotation, and the Python
  # gguf package reading gguftest's fixture. They were all green when this job was added and
  # all four ran only by hand before it, which is the exact condition `jinja_diff` rotted in.
  #
  # They share a job because each is a second or two of work; splitting them buys four checkout
  # and setup steps for no earlier signal. The steps are separate so a red run names which one.
  #
  # xcheck-fixture needs bin/orbix to read the fixture back, so build runs first. The other
  # three dump their Go side through a `go test -run` inside their own recipe.
  xcheck-parts:
    name: xcheck (pre, quant, rope, fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - uses: astral-sh/setup-uv@v10.4.0

      - name: just build
        run: just build

      - name: just xcheck-pre
        run: just xcheck-pre

      - name: just xcheck-quant
        run: just xcheck-quant

      - name: just xcheck-rope
        run: just xcheck-rope

      - name: just xcheck-fixture
        run: just xcheck-fixture
